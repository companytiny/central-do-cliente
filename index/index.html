<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiny Creative - Login do Cliente</title>
    <!-- Fonte -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0f1015;
            --surface-color: #1a1c23;
            --primary-color: #f39c12;
            --primary-hover: #d68910;
            --text-main: #f0f0f0;
            --text-muted: #a0a0a0;
            --font-heading: 'Space Grotesk', sans-serif;
            --font-body: 'Space Grotesk', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Efeitos de fundo (bolhas de luz) */
        .bg-glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(243, 156, 18, 0.15) 0%, rgba(0,0,0,0) 70%);
            top: -100px;
            left: -100px;
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
        }
        .bg-glow-2 {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(52, 152, 219, 0.1) 0%, rgba(0,0,0,0) 70%);
            bottom: -200px;
            right: -100px;
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
        }

        .login-container {
            background: rgba(26, 28, 35, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 50px 40px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 400px;
            z-index: 1;
            text-align: center;
        }

        .login-container h1 {
            font-family: var(--font-heading);
            font-size: 24px;
            margin-bottom: 10px;
            color: #fff;
        }

        .login-container p {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 14px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group input {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 14px 15px;
            border-radius: 8px;
            color: #fff;
            font-family: var(--font-body);
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(243, 156, 18, 0.2);
        }

        .btn-login {
            width: 100%;
            background: var(--primary-color);
            color: #121212;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-family: var(--font-heading);
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 10px;
        }

        .btn-login:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        #error-msg {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 15px;
            display: none;
        }

        .loader {
            display: none;
            border: 3px solid rgba(0,0,0,0.1);
            border-top: 3px solid #121212;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>
    <div class="bg-glow-2"></div>

    <div class="login-container">
        <h1>Tiny Creative</h1>
        <p>Acesse o painel de aprovações do seu projeto</p>

        <form id="login-form">
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" required placeholder="seu@email.com">
            </div>
            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-login" id="btn-submit">
                <span id="btn-text">Entrar</span>
                <div class="loader" id="btn-loader"></div>
            </button>
            <div id="error-msg">Email ou senha incorretos.</div>
        </form>
    </div>

    <script src="database.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btnText = document.getElementById('btn-text');
            const btnLoader = document.getElementById('btn-loader');
            const errorMsg = document.getElementById('error-msg');
            
            btnText.style.display = 'none';
            btnLoader.style.display = 'block';
            errorMsg.style.display = 'none';
            
            try {
                const { data, error } = await window.supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password,
                });

                if (error) {
                    throw error;
                }

                // Login com sucesso, redirecionar para a página principal (Postagens)
                window.location.href = 'postagens.html';
                
            } catch (err) {
                errorMsg.innerText = "Email ou senha incorretos.";
                errorMsg.style.display = 'block';
                btnText.style.display = 'block';
                btnLoader.style.display = 'none';
            }
        });
        
        // Checar se já está logado
        window.onload = async () => {
            if (window.supabaseClient) {
                const { data } = await window.supabaseClient.auth.getSession();
                if (data && data.session) {
                    window.location.href = 'postagens.html';
                }
            }
        };
    </script>
</body>
</html>
